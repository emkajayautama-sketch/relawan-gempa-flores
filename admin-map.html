<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Sebaran - Command Center</title>
    <link href="/src/style.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Auth Guard -->
    <script type="module">
        import { auth } from './src/firebase.js';
        import { onAuthStateChanged, signOut } from 'firebase/auth';

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'login.html';
            } else if (!user.email.includes('admin')) {
                alert("Akses ditolak. Halaman khusus Admin.");
                window.location.href = 'index.html';
            }
        });
        
        window.logout = () => {
            signOut(auth).then(() => window.location.href = 'login.html');
        };
    </script>
</head>
<body class="bg-slate-900 text-slate-100 antialiased h-screen overflow-hidden flex selection:bg-trust-500 selection:text-white">
    
    <!-- Sidebar -->
    <aside class="w-64 glass-dark h-full flex flex-col justify-between border-r border-slate-700/50 z-20 shrink-0">
        <div>
            <div class="h-20 flex items-center px-6 border-b border-slate-700/50 bg-slate-900/40">
                <div class="bg-gradient-to-tr from-trust-600 to-trust-400 p-2 rounded-lg mr-3 shadow-lg shadow-trust-600/30">
                    <i data-lucide="activity" class="text-white w-5 h-5"></i>
                </div>
                <h1 id="sidebar-app-title" class="text-lg font-bold tracking-wide text-white leading-tight">Relawan Gempa</h1>
            </div>
            
            <nav class="p-4 space-y-2 mt-4">
                <a href="admin.html" class="flex items-center px-4 py-3 text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 rounded-xl transition-all group">
                    <i data-lucide="layout-dashboard" class="w-5 h-5 mr-3 group-hover:text-trust-400 transition-colors"></i>
                    <span class="font-medium">Dashboard Utama</span>
                </a>
                <a href="admin-pengungsi.html" class="flex items-center px-4 py-3 text-slate-300 hover:text-white hover:bg-slate-800/80 rounded-xl transition-all group">
                    <i data-lucide="users" class="w-5 h-5 mr-3 group-hover:text-trust-500 transition-colors"></i>
                    <span class="font-medium">Data Pengungsi</span>
                </a>
                <a href="admin-map.html" class="flex items-center px-4 py-3 bg-trust-500/20 text-trust-400 rounded-xl border border-trust-500/30 transition-all relative">
                    <div class="absolute left-0 top-1/2 -translate-y-1/2 w-1.5 h-8 bg-trust-500 rounded-r-full shadow-[0_0_10px_rgba(59,130,246,0.8)]"></div>
                    <i data-lucide="map" class="w-5 h-5 mr-3"></i>
                    <span class="font-bold">Peta Sebaran</span>
                </a>
                <a href="admin-logistik.html" class="flex items-center px-4 py-3 text-slate-300 hover:text-white hover:bg-slate-800/80 rounded-xl transition-all group">
                    <i data-lucide="box" class="w-5 h-5 mr-3 group-hover:text-alert-400 transition-colors"></i>
                    <span class="font-medium">Klaster Logistik</span>
                </a>
                <a href="admin-galeri.html" class="flex items-center px-4 py-3 text-slate-300 hover:text-white hover:bg-slate-800/80 rounded-xl transition-all group">
                    <i data-lucide="camera" class="w-5 h-5 mr-3 group-hover:text-purple-400 transition-colors"></i>
                    <span class="font-medium">Galeri Lapangan</span>
                </a>
                <a href="admin-relawan.html" class="flex items-center px-4 py-3 text-slate-300 hover:text-white hover:bg-slate-800/80 rounded-xl transition-all group">
                    <i data-lucide="settings" class="w-5 h-5 mr-3 group-hover:text-trust-400 transition-colors"></i>
                    <span class="font-medium">Tim & Pengaturan</span>
                </a>
            </nav>
        </div>
        
        <!-- User profile bottom -->
        <div class="p-4 border-t border-slate-700/50 bg-slate-900/40">
            <div class="flex items-center px-2 py-2 rounded-xl hover:bg-slate-800 cursor-pointer transition-colors" onclick="logout()">
                <img src="https://i.pravatar.cc/150?img=11" alt="Admin" class="w-10 h-10 rounded-full border-2 border-slate-600">
                <div class="ml-3">
                    <p id="admin-identity-name" class="text-sm font-bold text-white">Admin Relawan Gempa</p>
                    <p class="text-xs text-red-400 flex items-center hover:text-red-300 font-medium">
                        <i data-lucide="log-out" class="w-3.5 h-3.5 mr-1.5"></i> Logout
                    </p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full relative p-6">
        
        <header class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-2xl font-bold text-white tracking-wide">Peta Sebaran Posko</h2>
                <p class="text-sm text-slate-400">Pemantauan lokasi posko aktif via GPS relawan</p>
            </div>
            <div class="bg-slate-800 rounded-lg p-1 flex shadow-inner mr-4">
                <button id="btn-jalan" class="px-4 py-1.5 rounded-md bg-slate-700 text-white font-medium text-sm transition-colors">Mode Jalan</button>
                <button id="btn-satelit" class="px-4 py-1.5 rounded-md text-slate-400 hover:text-white font-medium text-sm transition-colors">Mode Satelit</button>
            </div>
            <div id="kecamatan-selector" class="hidden">
                <select id="filter-kecamatan" class="px-4 py-2 border border-slate-700 rounded-full text-slate-300 bg-slate-800 focus:outline-none focus:border-trust-500 text-sm cursor-pointer appearance-none pr-8 relative glass-dark">
                    <option value="pusat">Pusat (Semua Data)</option>
                    <option value="aesesa">Kecamatan Aesesa</option>
                    <option value="aesesa_selatan">Kecamatan Aesesa Selatan</option>
                    <option value="boawae">Kecamatan Boawae</option>
                    <option value="keo_tengah">Kecamatan Keo Tengah</option>
                    <option value="mauponggo">Kecamatan Mauponggo</option>
                    <option value="nangaroro">Kecamatan Nangaroro</option>
                    <option value="wolowae">Kecamatan Wolowae</option>
                </select>
            </div>
        </header>

        <!-- Container Peta -->
        <div class="flex-1 w-full bg-slate-800 rounded-3xl overflow-hidden border border-slate-700/80 shadow-2xl relative">
            <div id="map" class="w-full h-full"></div>
            
            <!-- Legenda Melayang -->
            <div class="absolute bottom-6 right-6 z-[1000] glass-dark p-4 rounded-2xl border border-slate-600/50 shadow-xl">
                <h4 class="text-sm font-bold text-white mb-3">Status Posko</h4>
                <div class="space-y-2">
                    <div class="flex items-center">
                        <span class="w-3 h-3 rounded-full bg-blue-500 border border-white mr-2"></span>
                        <span class="text-xs text-slate-300">Stok Logistik Aman</span>
                    </div>
                    <div class="flex items-center">
                        <span class="w-3 h-3 rounded-full bg-orange-500 border border-white mr-2"></span>
                        <span class="text-xs text-slate-300">Stok Menipis</span>
                    </div>
                    <div class="flex items-center">
                        <span class="w-3 h-3 rounded-full bg-red-500 border border-white mr-2 animate-pulse"></span>
                        <span class="text-xs text-slate-300">Darurat Logistik / Medis</span>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script type="module">
        import { db, auth } from './src/firebase.js';
        import { collection, onSnapshot, query, where, doc, getDoc } from 'firebase/firestore';
        import { onAuthStateChanged } from 'firebase/auth';
        
        lucide.createIcons();

        // Inisialisasi Peta Leaflet (Koordinat Tengah: Larantuka, Flores Timur)
        const map = L.map('map').setView([-8.3371, 122.9818], 11);

        // Tile layer gratis
        const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap',
            maxZoom: 19
        });
        
        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri',
            maxZoom: 19
        });

        // Set default ke Mode Jalan
        streetLayer.addTo(map);
        // Mengubah warna OSM menjadi dark mode menggunakan CSS Filter
        map.getPane('tilePane').style.filter = 'invert(100%) hue-rotate(180deg) brightness(85%) contrast(90%) saturate(60%)';

        // Logika Toggle Mode Peta
        const btnJalan = document.getElementById('btn-jalan');
        const btnSatelit = document.getElementById('btn-satelit');

        btnJalan.addEventListener('click', () => {
            map.removeLayer(satelliteLayer);
            streetLayer.addTo(map);
            map.getPane('tilePane').style.filter = 'invert(100%) hue-rotate(180deg) brightness(85%) contrast(90%) saturate(60%)';
            
            btnJalan.classList.replace('text-slate-400', 'text-white');
            btnJalan.classList.add('bg-slate-700');
            btnSatelit.classList.replace('text-white', 'text-slate-400');
            btnSatelit.classList.remove('bg-slate-700');
        });

        btnSatelit.addEventListener('click', () => {
            map.removeLayer(streetLayer);
            satelliteLayer.addTo(map);
            map.getPane('tilePane').style.filter = 'none'; // satelit jangan di-invert
            
            btnSatelit.classList.replace('text-slate-400', 'text-white');
            btnSatelit.classList.add('bg-slate-700');
            btnJalan.classList.replace('text-white', 'text-slate-400');
            btnJalan.classList.remove('bg-slate-700');
        });

        const redIcon = L.divIcon({
            className: 'custom-div-icon',
            html: "<div class='w-5 h-5 bg-red-500 rounded-full border-2 border-white shadow-[0_0_15px_rgba(239,68,68,0.8)] animate-pulse'></div>",
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });

        const blueIcon = L.divIcon({
            className: 'custom-div-icon',
            html: "<div class='w-4 h-4 bg-blue-500 rounded-full border-2 border-white shadow-lg'></div>",
            iconSize: [16, 16],
            iconAnchor: [8, 8]
        });

        // LayerGroup untuk menyimpan semua marker
        let markerLayer = L.layerGroup().addTo(map);

        let currentKecamatan = 'pusat';
        let unsubPosko;

        // Listen ke koleksi "posko" di Firestore
        onAuthStateChanged(auth, async (user) => {
            if (user && user.email.includes('admin')) {
                const emailPrefix = user.email.split('@')[0];
                const kecamatanSelector = document.getElementById('kecamatan-selector');
                const selectKecamatan = document.getElementById('filter-kecamatan');
                
                if (emailPrefix === 'admin' || emailPrefix === 'admin_pusat') {
                    kecamatanSelector.classList.remove('hidden');
                } else if (emailPrefix.startsWith('admin_')) {
                    currentKecamatan = emailPrefix.replace('admin_', '');
                    const opt = Array.from(selectKecamatan.options).find(o => o.value === currentKecamatan);
                    if (opt) selectKecamatan.value = currentKecamatan;
                }
                
                let displayName = "Admin Relawan Gempa";
                if (emailPrefix === 'admin' || emailPrefix === 'admin_pusat') {
                    displayName = "Admin Utama (Pusat)";
                } else if (emailPrefix.startsWith('admin_')) {
                    const parts = currentKecamatan.split('_');
                    const capitalized = parts.map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
                    displayName = `Admin Kec. ${capitalized}`;
                }
                const identityEl = document.getElementById('admin-identity-name');
                if(identityEl) identityEl.innerText = displayName;

                const docIdKop = currentKecamatan === 'pusat' ? 'kopsurat' : `kopsurat_${currentKecamatan}`;
                try {
                    const docSnap = await getDoc(doc(db, "pengaturan", docIdKop));
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        const appTitleEl = document.getElementById('sidebar-app-title');
                        if (appTitleEl && data.nama1) {
                            appTitleEl.innerHTML = `${data.nama1}<span class="block text-xs font-normal text-trust-300 mt-0.5">${data.nama2 || ''}</span>`;
                        }
                    }
                } catch(e) { console.error("Gagal load kop surat", e); }

                const loadMapData = () => {
                    const kecaVal = (emailPrefix === 'admin' || emailPrefix === 'admin_pusat') ? selectKecamatan.value : currentKecamatan;
                    currentKecamatan = kecaVal;

                    if (unsubPosko) unsubPosko();

                    let qPosko = kecaVal === 'pusat' ? query(collection(db, "posko")) : query(collection(db, "posko"), where("kecamatan", "==", kecaVal));

                    unsubPosko = onSnapshot(qPosko, (snapshot) => {
                        // Hapus marker lama jika ada perubahan
                        markerLayer.clearLayers();
                        
                        if (snapshot.empty) {
                            return;
                        }

                        // Looping data riil dari Firebase
                        snapshot.forEach((doc) => {
                            const data = doc.data();
                            if (data.lat && data.lng) {
                                const icon = data.status === 'Kritis' ? redIcon : blueIcon;
                                L.marker([data.lat, data.lng], {icon: icon}).addTo(markerLayer)
                                    .bindPopup(`
                                        <div class='p-1'>
                                            <h3 class='font-bold text-slate-800'>${data.nama}</h3>
                                            <p class='text-xs font-medium mb-1 ${data.status === 'Kritis' ? 'text-red-600' : 'text-blue-600'}'>Status: ${data.status ? data.status.toUpperCase() : 'AMAN'}</p>
                                            <p class='text-xs text-slate-600'>Relawan: ${data.relawan || 'Anonim'}<br>Pengungsi: ${data.jumlahPengungsi || 0} Jiwa</p>
                                        </div>
                                    `);
                            }
                        });
                    });
                };

                loadMapData();
                selectKecamatan.addEventListener('change', loadMapData);
            }
        });
    </script>
</body>
</html>
