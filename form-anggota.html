<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Input Anggota Keluarga</title>
    <link href="/src/style.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-200 antialiased overflow-x-hidden selection:bg-trust-500 selection:text-white">
    <div class="max-w-md mx-auto min-h-screen relative bg-slate-50 shadow-2xl pb-24 overflow-hidden flex flex-col">
        
        <!-- Header -->
        <header class="w-full glass z-50 border-b border-slate-200 shrink-0">
            <div class="px-6 py-4 flex items-center">
                <a href="form-pengungsi.html" class="p-2 -ml-2 rounded-xl hover:bg-slate-200/50 transition-colors">
                    <i data-lucide="arrow-left" class="w-6 h-6 text-slate-700"></i>
                </a>
                <h1 class="text-slate-800 font-bold text-lg ml-3">Data Anggota Keluarga</h1>
            </div>
        </header>

        <!-- Progress Wizard -->
        <div class="px-6 pt-6 pb-2 shrink-0">
            <div class="flex justify-between items-center relative">
                <div class="absolute top-1/2 left-0 w-full h-1 bg-trust-500 -z-10 transform -translate-y-1/2"></div>
                
                <div class="flex flex-col items-center">
                    <div class="w-8 h-8 rounded-full bg-trust-500 text-white flex items-center justify-center font-bold text-sm shadow-md"><i data-lucide="check" class="w-4 h-4"></i></div>
                    <span class="text-[10px] font-bold text-trust-600 mt-2">Data KK</span>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-8 h-8 rounded-full bg-trust-500 text-white border-2 border-trust-500 flex items-center justify-center font-bold text-sm shadow-md">2</div>
                    <span class="text-[10px] font-bold text-trust-600 mt-2">Anggota</span>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-8 h-8 rounded-full bg-white border-2 border-slate-300 text-slate-400 flex items-center justify-center font-bold text-sm">3</div>
                    <span class="text-[10px] font-medium text-slate-400 mt-2">Selesai</span>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto px-6 py-4">
            
            <div class="mb-4 flex justify-between items-end">
                <div>
                    <h2 class="text-xl font-bold text-slate-800">Daftar Anggota</h2>
                    <p class="text-xs text-slate-500">Keluarga Bpk. Budi (No KK: 123...)</p>
                </div>
                <span class="bg-trust-100 text-trust-700 text-xs font-bold px-2 py-1 rounded-lg">0 Terdata</span>
            </div>

            <!-- List Anggota Kosong -->
            <div id="emptyState" class="bg-slate-100 border-2 border-dashed border-slate-300 rounded-3xl p-8 flex flex-col items-center justify-center text-center mb-6">
                <div class="bg-white p-4 rounded-full shadow-sm mb-3">
                    <i data-lucide="user-plus" class="w-8 h-8 text-slate-400"></i>
                </div>
                <p class="text-slate-500 text-sm font-medium">Belum ada anggota keluarga yang ditambahkan.</p>
            </div>

            <!-- Form Tambah Anggota -->
            <div class="bg-white border border-slate-200 rounded-3xl p-5 shadow-lg shadow-slate-200/50 mb-6">
                <h3 class="font-bold text-slate-800 mb-4 border-b border-slate-100 pb-2">Tambah Baru</h3>
                <form id="formAnggota" class="space-y-4">
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap</label>
                        <input type="text" id="nama" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-trust-500" required>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">NIK (Opsional)</label>
                            <input type="tel" id="nik" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-trust-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Jenis Kelamin</label>
                            <select id="gender" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-trust-500">
                                <option value="L">Laki-laki</option>
                                <option value="P">Perempuan</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 items-end">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Umur (Tahun)</label>
                            <input type="number" id="umur" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-trust-500" placeholder="Cth: 25" required>
                            <p class="text-[10px] text-slate-400 mt-1">*Jika bayi, isi 0</p>
                        </div>
                        <div class="pb-1">
                            <span id="kategoriUmurBadge" class="bg-slate-200 text-slate-600 text-xs font-bold px-3 py-2 rounded-lg block text-center">Auto-Kategori</span>
                        </div>
                    </div>

                    <!-- Status Rentan (Khusus) -->
                    <div class="pt-2 border-t border-slate-100">
                        <label class="block text-xs font-semibold text-slate-700 mb-2">Indikator Khusus / Rentan (Pilih jika ada)</label>
                        <div class="flex flex-wrap gap-2">
                            <label class="inline-flex items-center bg-pink-50 border border-pink-200 px-3 py-1.5 rounded-full cursor-pointer hover:bg-pink-100 transition-colors">
                                <input type="checkbox" value="Ibu Hamil/Menyusui" class="text-pink-500 rounded focus:ring-pink-500">
                                <span class="ml-2 text-xs font-medium text-pink-700">Hamil/Menyusui</span>
                            </label>
                            <label class="inline-flex items-center bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-full cursor-pointer hover:bg-amber-100 transition-colors">
                                <input type="checkbox" value="Disabilitas" class="text-amber-500 rounded focus:ring-amber-500">
                                <span class="ml-2 text-xs font-medium text-amber-700">Disabilitas</span>
                            </label>
                            <label class="inline-flex items-center bg-red-50 border border-red-200 px-3 py-1.5 rounded-full cursor-pointer hover:bg-red-100 transition-colors">
                                <input type="checkbox" value="Sakit Kronis" class="text-red-500 rounded focus:ring-red-500">
                                <span class="ml-2 text-xs font-medium text-red-700">Sakit Kronis</span>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white text-sm font-bold rounded-xl py-3 mt-4 flex justify-center items-center transition-transform active:scale-95">
                        <i data-lucide="plus" class="w-4 h-4 mr-1"></i> Simpan Anggota
                    </button>
                </form>
            </div>

        </main>

        <!-- Bottom Footer Action -->
        <div class="p-6 bg-white border-t border-slate-200 shrink-0">
             <button id="btnSelesai" class="w-full bg-trust-600 hover:bg-trust-700 text-white font-bold rounded-2xl py-4 shadow-lg shadow-trust-600/30 flex justify-center items-center transition-transform active:scale-95">
                Selesaikan Pendaftaran <i data-lucide="check-circle" class="w-5 h-5 ml-2"></i>
            </button>
        </div>
    </div>

    <script type="module">
        import { db } from './src/firebase.js';
        import { collection, addDoc, serverTimestamp } from 'firebase/firestore';

        lucide.createIcons();

        // Ambil kkId dari URL
        const urlParams = new URLSearchParams(window.location.search);
        const kkId = urlParams.get('kkId');

        if (!kkId) {
            alert("Sesi tidak valid! Harap isi data KK terlebih dahulu.");
            window.location.href = 'form-pengungsi.html';
        }

        const inputUmur = document.getElementById('umur');
        const badgeUmur = document.getElementById('kategoriUmurBadge');

        // Logic Auto-Klasifikasi Umur
        inputUmur.addEventListener('input', (e) => {
            const umur = parseInt(e.target.value);
            let kategori = 'Tidak diketahui';
            let color = 'bg-slate-200 text-slate-600';

            if (isNaN(umur)) {
                badgeUmur.className = `text-xs font-bold px-3 py-2 rounded-lg block text-center bg-slate-200 text-slate-600`;
                badgeUmur.innerText = 'Auto-Kategori';
                return;
            }

            if (umur < 1) {
                kategori = 'Bayi (<1 thn)'; color = 'bg-pink-100 text-pink-700';
            } else if (umur >= 1 && umur <= 5) {
                kategori = 'Balita (1-5 thn)'; color = 'bg-orange-100 text-orange-700';
            } else if (umur >= 6 && umur <= 12) {
                kategori = 'Anak (6-12 thn)'; color = 'bg-blue-100 text-blue-700';
            } else if (umur >= 13 && umur <= 59) {
                kategori = 'Dewasa (13-59 thn)'; color = 'bg-green-100 text-green-700';
            } else if (umur >= 60) {
                kategori = 'Lansia (≥60 thn)'; color = 'bg-purple-100 text-purple-700';
            }

            badgeUmur.className = `text-xs font-bold px-3 py-2 rounded-lg block text-center ${color}`;
            badgeUmur.innerText = kategori;
        });
        
        // Simpan Anggota ke Firestore
        let counterAnggota = 0;
        document.getElementById('formAnggota').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="animate-spin mr-2">⏳</span> Menyimpan...';
            btn.disabled = true;

            const nama = document.getElementById('nama').value;
            const nik = document.getElementById('nik').value;
            const gender = document.getElementById('gender').value;
            const umur = parseInt(document.getElementById('umur').value);
            
            // Ambil semua checkbox rentan yang dicentang
            const rentanCheckboxes = document.querySelectorAll('input[type="checkbox"]:checked');
            const statusRentan = Array.from(rentanCheckboxes).map(cb => cb.value);

            try {
                await addDoc(collection(db, "anggota"), {
                    kkId: kkId,
                    nama: nama,
                    nik: nik,
                    gender: gender,
                    pelapor: auth.currentUser?.email || "Relawan Anonim",
                    poskoAktif: localStorage.getItem('poskoName') || "Posko Nagekeo",
                    umur: umur,
                    kategoriUmur: badgeUmur.innerText,
                    statusRentan: statusRentan,
                    createdAt: serverTimestamp()
                });

                counterAnggota++;
                // Update badge jumlah anggota
                document.querySelector('.bg-trust-100.text-trust-700').innerText = `${counterAnggota} Terdata`;

                alert("Anggota berhasil disimpan!");
                
                // Reset form
                e.target.reset();
                badgeUmur.className = `text-xs font-bold px-3 py-2 rounded-lg block text-center bg-slate-200 text-slate-600`;
                badgeUmur.innerText = 'Auto-Kategori';
            } catch (error) {
                console.error("Error adding anggota: ", error);
                alert("Gagal menyimpan: " + error.message);
            } finally {
                btn.innerHTML = '<i data-lucide="plus" class="w-4 h-4 mr-1"></i> Simpan Anggota';
                btn.disabled = false;
                lucide.createIcons();
            }
        });

        document.getElementById('btnSelesai').addEventListener('click', () => {
            if(counterAnggota === 0) {
                if(!confirm("Anda belum memasukkan anggota keluarga manapun (Termasuk Kepala Keluarga). Yakin ingin selesai?")) {
                    return;
                }
            }
            alert("Pendaftaran Keluarga Selesai!");
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
