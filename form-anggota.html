<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Input Anggota Keluarga</title>
    <link href="/src/style.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 antialiased overflow-x-hidden selection:bg-trust-500 selection:text-white">
    <div class="max-w-md mx-auto min-h-screen relative bg-slate-900 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-900 via-slate-900 to-black shadow-2xl pb-24 overflow-hidden flex flex-col">
        
        <!-- Header -->
        <header class="w-full bg-white/5 backdrop-blur-xl border-b border-white/10 z-50 shrink-0">
            <div class="px-6 py-4 flex items-center">
                <a href="form-pengungsi.html" class="p-2 -ml-2 rounded-xl hover:bg-white/10 transition-colors">
                    <i data-lucide="arrow-left" class="w-6 h-6 text-white"></i>
                </a>
                <h1 class="text-white font-bold text-lg ml-3">Data Anggota Keluarga</h1>
            </div>
        </header>

        <!-- Progress Wizard -->
        <div class="px-6 pt-6 pb-2 shrink-0">
            <div class="flex justify-between items-center relative">
                <div class="absolute top-1/2 left-0 w-full h-1 bg-trust-500 -z-10 transform -translate-y-1/2 shadow-[0_0_10px_rgba(56,189,248,0.5)]"></div>
                
                <div class="flex flex-col items-center">
                    <div class="w-8 h-8 rounded-full bg-trust-500 text-white flex items-center justify-center font-bold text-sm shadow-[0_0_10px_rgba(56,189,248,0.5)]"><i data-lucide="check" class="w-4 h-4"></i></div>
                    <span class="text-[10px] font-bold text-trust-400 mt-2">Data KK</span>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-8 h-8 rounded-full bg-trust-500 text-white border-2 border-trust-400 flex items-center justify-center font-bold text-sm shadow-[0_0_10px_rgba(56,189,248,0.5)]">2</div>
                    <span class="text-[10px] font-bold text-trust-400 mt-2">Anggota</span>
                </div>
                <div class="flex flex-col items-center">
                    <div class="w-8 h-8 rounded-full bg-slate-800 border-2 border-slate-600 text-slate-400 flex items-center justify-center font-bold text-sm shadow-md">3</div>
                    <span class="text-[10px] font-medium text-slate-400 mt-2">Selesai</span>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto px-6 py-4">
            
            <div class="mb-4 flex justify-between items-end">
                <div>
                    <h2 class="text-xl font-bold text-white">Daftar Anggota</h2>
                    <p class="text-xs text-slate-400" id="kkInfoText">Memuat Data KK...</p>
                </div>
                <span id="counterBadge" class="bg-trust-500/20 border border-trust-500/30 text-trust-400 text-xs font-bold px-2 py-1 rounded-lg">0 Terdata</span>
            </div>

            <!-- List Anggota Kosong -->
            <div id="emptyState" class="bg-white/5 border-2 border-dashed border-white/20 rounded-3xl p-8 flex flex-col items-center justify-center text-center mb-6">
                <div class="bg-slate-800 p-4 rounded-full shadow-md mb-3 border border-white/10">
                    <i data-lucide="user-plus" class="w-8 h-8 text-slate-400"></i>
                </div>
                <p class="text-slate-300 text-sm font-medium">Belum ada anggota keluarga yang ditambahkan.</p>
            </div>
            
            <!-- List Anggota (Terisi) -->
            <div id="listAnggota" class="space-y-3 mb-6 hidden">
                <!-- Data akan di-render di sini oleh JavaScript -->
            </div>

            <!-- Form Tambah Anggota -->
            <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-3xl p-5 shadow-lg shadow-black/20 mb-6">
                <h3 class="font-bold text-white mb-4 border-b border-white/10 pb-2">Tambah Baru</h3>
                <form id="formAnggota" class="space-y-4">
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Nama Lengkap</label>
                        <input type="text" id="nama" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-trust-500" required>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">NIK (Opsional)</label>
                            <input type="tel" id="nik" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-trust-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Jenis Kelamin</label>
                            <select id="gender" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-trust-500">
                                <option value="L" class="bg-slate-800">Laki-laki</option>
                                <option value="P" class="bg-slate-800">Perempuan</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 items-end">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Umur (Tahun)</label>
                            <input type="number" id="umur" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-trust-500" placeholder="Cth: 25" required>
                            <p class="text-[10px] text-slate-400 mt-1">*Jika bayi, isi 0</p>
                        </div>
                        <div class="pb-1">
                            <span id="kategoriUmurBadge" class="bg-white/10 text-slate-300 border border-white/10 text-xs font-bold px-3 py-2 rounded-lg block text-center">Auto-Kategori</span>
                        </div>
                    </div>

                    <!-- Status Rentan (Khusus) -->
                    <div class="pt-2 border-t border-white/10">
                        <label class="block text-xs font-semibold text-slate-300 mb-2">Indikator Khusus / Rentan (Pilih jika ada)</label>
                        <div class="flex flex-wrap gap-2">
                            <label class="inline-flex items-center bg-pink-500/20 border border-pink-500/30 px-3 py-1.5 rounded-full cursor-pointer hover:bg-pink-500/30 transition-colors">
                                <input type="checkbox" value="Ibu Hamil/Menyusui" class="text-pink-500 rounded focus:ring-pink-500 bg-slate-800 border-white/20">
                                <span class="ml-2 text-xs font-medium text-pink-300">Hamil/Menyusui</span>
                            </label>
                            <label class="inline-flex items-center bg-amber-500/20 border border-amber-500/30 px-3 py-1.5 rounded-full cursor-pointer hover:bg-amber-500/30 transition-colors">
                                <input type="checkbox" value="Disabilitas" class="text-amber-500 rounded focus:ring-amber-500 bg-slate-800 border-white/20">
                                <span class="ml-2 text-xs font-medium text-amber-300">Disabilitas</span>
                            </label>
                            <label class="inline-flex items-center bg-red-500/20 border border-red-500/30 px-3 py-1.5 rounded-full cursor-pointer hover:bg-red-500/30 transition-colors">
                                <input type="checkbox" value="Sakit Kronis" class="text-red-500 rounded focus:ring-red-500 bg-slate-800 border-white/20">
                                <span class="ml-2 text-xs font-medium text-red-300">Sakit Kronis</span>
                            </label>
                        </div>
                    </div>

                    <button type="submit" id="btnSimpan" class="w-full bg-trust-600 hover:bg-trust-500 text-white text-sm font-bold rounded-xl py-4 mt-4 shadow-lg shadow-trust-600/30 flex justify-center items-center transition-transform active:scale-95">
                        <i data-lucide="plus" class="w-5 h-5 mr-2"></i> Simpan Data Anggota Ini
                    </button>
                </form>
            </div>

        </main>

        <!-- Bottom Footer Action -->
        <div class="p-6 bg-slate-900/80 backdrop-blur-xl border-t border-white/10 shrink-0">
             <button id="btnSelesai" class="w-full bg-white/10 hover:bg-white/20 text-white border border-white/20 font-bold rounded-2xl py-4 flex justify-center items-center transition-transform active:scale-95">
                Selesai & Kembali ke Beranda <i data-lucide="check-circle" class="w-5 h-5 ml-2 text-trust-400"></i>
            </button>
        </div>
    </div>

    <script type="module">
        import { db, auth } from './src/firebase.js';
        import { collection, addDoc, getDoc, doc, query, where, onSnapshot, deleteDoc } from 'firebase/firestore';
        import { onAuthStateChanged } from 'firebase/auth';

        lucide.createIcons();

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            // Ambil kkId dari URL
            const urlParams = new URLSearchParams(window.location.search);
            const kkId = urlParams.get('kkId');

            if (!kkId) {
                alert("Sesi tidak valid! Harap isi data KK terlebih dahulu.");
                window.location.href = 'form-pengungsi.html';
                return;
            }

            // Fetch info KK
            getDoc(doc(db, "keluarga", kkId)).then(docSnap => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('kkInfoText').innerText = `Keluarga: ${data.namaKepalaKeluarga} (No KK: ${data.noKk})`;
                }
            });

            const emptyState = document.getElementById('emptyState');
            const listAnggota = document.getElementById('listAnggota');
            const counterBadge = document.getElementById('counterBadge');
            
            // Listen realtime Anggota for this KK
            const qAnggota = query(collection(db, "anggota"), where("kkId", "==", kkId));
            onSnapshot(qAnggota, (snapshot) => {
                counterAnggota = snapshot.size;
                counterBadge.innerText = `${counterAnggota} Terdata`;

                if (snapshot.empty) {
                    emptyState.classList.remove('hidden');
                    listAnggota.classList.add('hidden');
                    listAnggota.innerHTML = '';
                } else {
                    emptyState.classList.add('hidden');
                    listAnggota.classList.remove('hidden');
                    
                    let html = '';
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        
                        // Format rentan
                        let rentanHtml = '';
                        if (data.statusRentan && data.statusRentan.length > 0) {
                            rentanHtml = `<div class="flex gap-1 mt-2">` + data.statusRentan.map(r => `<span class="px-2 py-0.5 bg-amber-50 text-amber-600 border border-amber-200 text-[9px] rounded font-bold uppercase">${r}</span>`).join('') + `</div>`;
                        }
                        
                        html += `
                            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                                <div>
                                    <h4 class="font-bold text-slate-800 text-sm">${data.nama}</h4>
                                    <p class="text-xs text-slate-500">${data.umur} Tahun • ${data.gender === 'L' ? 'Laki-laki' : 'Perempuan'}</p>
                                    ${rentanHtml}
                                </div>
                                <button onclick="hapusAnggota('${doc.id}')" class="w-8 h-8 rounded-full bg-red-50 text-red-500 flex items-center justify-center hover:bg-red-100 transition-colors">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        `;
                    });
                    listAnggota.innerHTML = html;
                    lucide.createIcons();
                }
            });

            const inputUmur = document.getElementById('umur');
            const badgeUmur = document.getElementById('kategoriUmurBadge');

            // Logic Auto-Klasifikasi Umur
            inputUmur.addEventListener('input', (e) => {
                const umur = parseInt(e.target.value);
                let kategori = 'Tidak diketahui';
                let color = 'bg-slate-200 text-slate-600';

                if (isNaN(umur)) {
                    badgeUmur.className = `text-xs font-bold px-3 py-2 rounded-lg block text-center bg-slate-200 text-slate-600`;
                    badgeUmur.innerText = 'Auto-Kategori';
                    return;
                }

                if (umur < 1) {
                    kategori = 'Bayi (<1 thn)'; color = 'bg-pink-100 text-pink-700';
                } else if (umur >= 1 && umur <= 5) {
                    kategori = 'Balita (1-5 thn)'; color = 'bg-orange-100 text-orange-700';
                } else if (umur >= 6 && umur <= 12) {
                    kategori = 'Anak (6-12 thn)'; color = 'bg-blue-100 text-blue-700';
                } else if (umur >= 13 && umur <= 59) {
                    kategori = 'Dewasa (13-59 thn)'; color = 'bg-green-100 text-green-700';
                } else if (umur >= 60) {
                    kategori = 'Lansia (≥60 thn)'; color = 'bg-purple-100 text-purple-700';
                }

                badgeUmur.className = `text-xs font-bold px-3 py-2 rounded-lg block text-center ${color}`;
                badgeUmur.innerText = kategori;
            });
            
            // Simpan Anggota ke Firestore
            let counterAnggota = 0;
            document.getElementById('formAnggota').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const btn = e.target.querySelector('button[type="submit"]');
                btn.innerHTML = '<span class="animate-spin mr-2">⏳</span> Menyimpan...';
                btn.disabled = true;

                const nama = document.getElementById('nama').value;
                const nik = document.getElementById('nik').value;
                const gender = document.getElementById('gender').value;
                const umur = parseInt(document.getElementById('umur').value);
                
                // Ambil semua checkbox rentan yang dicentang
                const rentanCheckboxes = document.querySelectorAll('input[type="checkbox"]:checked');
                const statusRentan = Array.from(rentanCheckboxes).map(cb => cb.value);

                try {
                    await addDoc(collection(db, "anggota"), {
                        kkId: kkId,
                        nama: nama,
                        nik: nik,
                        gender: gender,
                        pelapor: user.email || "Relawan Anonim",
                        poskoAktif: localStorage.getItem('poskoName') || "Posko Nagekeo",
                        umur: umur,
                        kategoriUmur: badgeUmur.innerText,
                        statusRentan: statusRentan,
                        createdAt: new Date()
                    });

                    // Update counter diurus oleh onSnapshot di atas
                    alert("Anggota berhasil disimpan!");
                    
                    // Reset form
                    e.target.reset();
                    badgeUmur.className = `text-xs font-bold px-3 py-2 rounded-lg block text-center bg-slate-200 text-slate-600`;
                    badgeUmur.innerText = 'Auto-Kategori';
                } catch (error) {
                    console.error("Error adding anggota: ", error);
                    alert("Gagal menyimpan: " + error.message);
                } finally {
                    btn.innerHTML = '<i data-lucide="plus" class="w-5 h-5 mr-2"></i> Simpan Data Anggota Ini';
                    btn.disabled = false;
                    lucide.createIcons();
                }
            });

            document.getElementById('btnSelesai').addEventListener('click', () => {
                if(counterAnggota === 0) {
                    if(!confirm("Anda belum memasukkan anggota keluarga manapun (Termasuk Kepala Keluarga). Yakin ingin selesai?")) {
                        return;
                    }
                }
                alert("Pendaftaran Keluarga Selesai!");
                window.location.href = 'index.html';
            });
        });

        // Delete function global
        window.hapusAnggota = async (id) => {
            if (confirm("Yakin ingin menghapus anggota ini?")) {
                try {
                    await deleteDoc(doc(db, "anggota", id));
                } catch (error) {
                    console.error("Gagal menghapus:", error);
                    alert("Gagal menghapus data.");
                }
            }
        };
    </script>
</body>
</html>
