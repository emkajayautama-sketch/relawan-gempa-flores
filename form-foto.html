<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Foto Lapangan - Relawan Gempa</title>
    <link href="/src/style.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-slate-900 antialiased overflow-x-hidden selection:bg-slate-500 selection:text-white">
    <div class="max-w-md mx-auto min-h-screen relative bg-slate-900 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-900 via-slate-900 to-black shadow-2xl pb-24 flex flex-col">
        
        <!-- Header -->
        <header class="w-full bg-slate-800/20 backdrop-blur-xl z-50 border-b border-white/10 shrink-0 shadow-md">
            <div class="px-6 py-4 flex items-center text-white">
                <a href="index.html" class="p-2 -ml-2 rounded-xl hover:bg-white/10 transition-colors">
                    <i data-lucide="arrow-left" class="w-6 h-6"></i>
                </a>
                <h1 class="font-bold text-lg ml-3">Dokumentasi Lapangan</h1>
            </div>
        </header>

        <div class="bg-white/5 px-6 py-3 flex items-start text-white border-b border-white/10">
            <i data-lucide="info" class="w-4 h-4 text-slate-400 mt-0.5 mr-2 shrink-0"></i>
            <p class="text-xs text-slate-300 font-medium leading-relaxed">
                Ambil foto kondisi di lapangan. Foto akan dilengkapi titik lokasi posko Anda secara otomatis.
            </p>
        </div>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto px-4 py-6 space-y-6">
            
            <form id="formFoto">
                
                <!-- Image Picker Area -->
                <div class="bg-white/5 backdrop-blur-md rounded-3xl p-4 shadow-lg shadow-black/20 border border-white/10 mb-6">
                    <label class="block text-sm font-semibold text-slate-300 mb-3">Foto Kondisi / Bukti Penyaluran</label>
                    
                    <input type="file" id="foto-input" accept="image/*" capture="environment" class="hidden">
                    
                    <div id="preview-container" class="w-full aspect-[4/3] bg-slate-800/50 border-2 border-dashed border-white/20 rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:bg-slate-800/80 transition-colors relative overflow-hidden group">
                        <!-- Empty State -->
                        <div id="empty-preview" class="flex flex-col items-center justify-center text-slate-400 group-hover:text-white transition-colors pointer-events-none">
                            <div class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center shadow-sm mb-3">
                                <i data-lucide="camera" class="w-8 h-8 text-slate-400"></i>
                            </div>
                            <p class="font-medium text-sm">Ketuk untuk Ambil Foto</p>
                            <p class="text-xs mt-1 text-slate-500 group-hover:text-slate-400">atau pilih dari galeri</p>
                        </div>
                        
                        <!-- Image Preview -->
                        <img id="image-preview" class="hidden absolute inset-0 w-full h-full object-cover" />
                        
                        <!-- Overlay when image is selected -->
                        <div id="overlay-preview" class="hidden absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity">
                            <span class="bg-slate-900/90 text-white px-4 py-2 rounded-full font-semibold text-sm shadow-lg flex items-center border border-white/20">
                                <i data-lucide="refresh-cw" class="w-4 h-4 mr-2"></i> Ganti Foto
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Caption Area -->
                <div class="bg-white/5 backdrop-blur-md rounded-3xl p-5 shadow-lg shadow-black/20 border border-white/10">
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Keterangan Singkat</label>
                    <textarea id="caption" rows="3" class="w-full bg-slate-800/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-slate-500 resize-none" placeholder="Misal: Tenda warga di RT 02 rubuh karena angin kencang..."></textarea>
                </div>
            </form>
        </main>

        <!-- Bottom Footer Action -->
        <div class="p-6 bg-slate-900/80 backdrop-blur-xl border-t border-white/10 shrink-0">
             <button id="btnUpload" disabled class="w-full bg-white/5 text-slate-500 border border-white/10 font-bold rounded-2xl py-4 flex justify-center items-center transition-all cursor-not-allowed">
                Unggah Foto <i data-lucide="upload-cloud" class="w-5 h-5 ml-2"></i>
            </button>
            <div id="progress-container" class="hidden mt-3">
                <div class="w-full bg-slate-800 rounded-full h-2.5">
                    <div id="progress-bar" class="bg-trust-500 h-2.5 rounded-full shadow-[0_0_8px_rgba(56,189,248,0.8)]" style="width: 0%"></div>
                </div>
                <p id="progress-text" class="text-xs text-center text-slate-400 mt-2 font-medium">0%</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, auth } from './src/firebase.js';
        import { collection, addDoc, serverTimestamp } from 'firebase/firestore';

        lucide.createIcons();

        const fotoInput = document.getElementById('foto-input');
        const previewContainer = document.getElementById('preview-container');
        const emptyPreview = document.getElementById('empty-preview');
        const imagePreview = document.getElementById('image-preview');
        const overlayPreview = document.getElementById('overlay-preview');
        const btnUpload = document.getElementById('btnUpload');
        const captionInput = document.getElementById('caption');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');

        let selectedFile = null;

        // Fungsi untuk kompresi gambar (Sangat penting untuk Database karena dibatasi 1MB)
        async function compressImageToBase64(file, maxWidth = 800) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // Kompresi ke format JPEG kualitas 60% (Hasilnya akan sekitar 50-100KB)
                        const base64String = canvas.toDataURL('image/jpeg', 0.6);
                        resolve(base64String);
                    };
                    img.onerror = () => {
                        reject(new Error("Gagal memproses gambar. Cobalah foto yang lain."));
                    };
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error("Gagal membaca file gambar."));
                reader.readAsDataURL(file);
            });
        }

        // Buka file picker jika container di-klik
        previewContainer.addEventListener('click', () => {
            if (!btnUpload.disabled || selectedFile === null) {
                fotoInput.click();
            }
        });

        // Tangani pemilihan file
        fotoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                // Validasi gambar
                if (!file.type.startsWith('image/')) {
                    alert("Tolong pilih file gambar/foto.");
                    return;
                }
                
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    imagePreview.src = e.target.result;
                    imagePreview.classList.remove('hidden');
                    overlayPreview.classList.remove('hidden');
                    emptyPreview.classList.add('hidden');
                    
                    // Enable button
                    btnUpload.disabled = false;
                    btnUpload.classList.remove('bg-white/5', 'text-slate-500', 'cursor-not-allowed');
                    btnUpload.classList.add('bg-white/20', 'text-white', 'hover:bg-white/30', 'active:scale-95', 'shadow-lg', 'shadow-black/50', 'border-white/30');
                }
                reader.readAsDataURL(file);
            }
        });

        // Proses unggah
        btnUpload.addEventListener('click', async () => {
            if (!selectedFile) return;

            const poskoName = localStorage.getItem('poskoName') || "Posko Nagekeo";
            const caption = captionInput.value.trim();

            // Kunci UI
            btnUpload.disabled = true;
            btnUpload.innerHTML = '<span class="animate-spin mr-2">⏳</span> Mengunggah...';
            btnUpload.classList.add('opacity-75', 'cursor-not-allowed');
            btnUpload.classList.remove('active:scale-95', 'hover:bg-white/30');
            fotoInput.disabled = true;
            captionInput.disabled = true;
            
            // Tampilkan progress
            progressContainer.classList.remove('hidden');
            progressBar.style.width = '10%';

            // Set Global Timeout 60 detik agar tidak hang selamanya
            const timeoutPromise = new Promise((_, reject) => {
                setTimeout(() => reject(new Error("Koneksi terputus atau internet terlalu lambat (Timeout).")), 60000);
            });

            // Proses utama di dalam fungsi async internal
            const uploadProcess = async () => {
                progressText.innerText = "Tahap 1/3: Memproses gambar (Kompresi)...";
                progressBar.style.width = '30%';
                
                // Kompresi gambar menjadi teks (Base64) agar bisa langsung disimpan ke Database
                const base64Image = await compressImageToBase64(selectedFile);
                
                progressText.innerText = "Tahap 2/3: Menyiapkan laporan...";
                progressBar.style.width = '60%';
                
                const timestamp = Date.now();
                const safePoskoName = poskoName.replace(/[^a-zA-Z0-9]/g, '_');
                const fileName = `dokumentasi/${safePoskoName}/${timestamp}.jpg`;

                progressText.innerText = "Tahap 3/3: Menyimpan ke Database...";
                progressBar.style.width = '90%';
                
                // Kita gunakan await agar aplikasi benar-benar menunggu konfirmasi dari Firebase
                // Jika gagal karena izin (belum login), error akan muncul di HP
                await addDoc(collection(db, "dokumentasi"), {
                    posko: poskoName,
                    pelapor: auth.currentUser?.email || "Relawan",
                    imageUrl: base64Image,
                    storagePath: fileName,
                    caption: caption,
                    createdAt: serverTimestamp(),
                    kecamatan: localStorage.getItem('kecamatan') || "aesesa"
                });

                progressBar.style.width = '100%';
                // Beri sedikit waktu agar bar 100% terlihat
                await new Promise(r => setTimeout(r, 500)); 
            };

            try {
                // Jalankan proses unggah dan batas waktu (timeout) bersamaan
                await Promise.race([uploadProcess(), timeoutPromise]);
                
                alert("Foto berhasil diunggah!");
                window.location.href = 'index.html';
            } catch (error) {
                console.error("Error:", error);
                // Matikan paksa jika ada proses upload yang masih jalan di background (opsional tapi aman)
                alert("Terjadi kesalahan/Gagal mengunggah: " + error.message);
                resetUI();
            }
        });

        function resetUI() {
            btnUpload.disabled = false;
            btnUpload.innerHTML = 'Unggah Foto <i data-lucide="upload-cloud" class="w-5 h-5 ml-2"></i>';
            btnUpload.classList.remove('opacity-75', 'cursor-not-allowed');
            btnUpload.classList.add('active:scale-95', 'hover:bg-white/30');
            fotoInput.disabled = false;
            captionInput.disabled = false;
            progressContainer.classList.add('hidden');
            progressBar.style.width = '0%';
            lucide.createIcons();
        }
    </script>
</body>
</html>
