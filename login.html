<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Relawan Gempa</title>
    <link href="/src/style.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 antialiased overflow-x-hidden selection:bg-trust-500 selection:text-white flex items-center justify-center min-h-screen">
    
    <!-- Background Design -->
    <div class="fixed top-0 left-0 w-full h-full -z-10 overflow-hidden">
        <div class="absolute -top-[20%] -left-[10%] w-[70%] h-[50%] bg-trust-600/30 rounded-full blur-[100px]"></div>
        <div class="absolute bottom-[10%] -right-[10%] w-[60%] h-[60%] bg-alert-600/20 rounded-full blur-[120px]"></div>
    </div>

    <div class="w-full max-w-md px-6 z-10 relative">
        <!-- Logo/Icon -->
        <div class="flex justify-center mb-8">
            <div class="w-20 h-20 bg-gradient-to-tr from-trust-500 to-trust-400 rounded-3xl flex items-center justify-center shadow-[0_0_40px_rgba(59,130,246,0.4)]">
                <i data-lucide="shield-alert" class="w-10 h-10 text-white"></i>
            </div>
        </div>

        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-white tracking-wide mb-3 drop-shadow-lg">Relawan Gempa</h1>
            <p class="text-slate-200 text-sm font-medium drop-shadow-md">Masuk untuk mulai mendata pengungsi & melaporkan stok logistik.</p>
        </div>

        <div class="glass-dark p-8 rounded-[2rem] border border-slate-700/50 shadow-2xl">
            <form id="loginForm" class="space-y-5">
                
                <div id="errorAlert" class="hidden bg-red-500/10 border border-red-500/50 text-red-400 p-3 rounded-xl text-sm mb-4 flex items-start">
                    <i data-lucide="alert-circle" class="w-5 h-5 mr-2 shrink-0"></i>
                    <span id="errorMessage">Email atau password salah!</span>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-400 ml-1">Email Relawan</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-slate-500"></i>
                        <input type="email" id="email" class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl pl-12 pr-4 py-3.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-trust-500 focus:border-transparent transition-all" placeholder="email@posko.com" required>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-400 ml-1">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-slate-500"></i>
                        <input type="password" id="password" class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl pl-12 pr-4 py-3.5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-trust-500 focus:border-transparent transition-all" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" id="btnLogin" class="w-full bg-trust-600 hover:bg-trust-500 text-white font-bold rounded-2xl py-3.5 mt-4 shadow-[0_0_20px_rgba(37,99,235,0.3)] transition-all active:scale-95 flex justify-center items-center">
                    Masuk ke Sistem <i data-lucide="arrow-right" class="w-5 h-5 ml-2"></i>
                </button>
            </form>
            
            <p class="text-center text-xs text-slate-500 mt-6">
                Belum punya akun? Hubungi Admin Pusat BPBD untuk pendaftaran.
            </p>
        </div>
    </div>

    <script type="module">
        import { auth } from './src/firebase.js';
        import { signInWithEmailAndPassword, onAuthStateChanged } from 'firebase/auth';
        
        lucide.createIcons();

        // Jika sudah login, lempar langsung ke halaman utama
        onAuthStateChanged(auth, (user) => {
            if (user) {
                if(user.email && user.email.includes('admin')) {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'index.html';
                }
            }
        });

        const form = document.getElementById('loginForm');
        const btnLogin = document.getElementById('btnLogin');
        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorAlert.classList.add('hidden');
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            btnLogin.innerHTML = '<span class="animate-spin w-5 h-5 border-2 border-white border-t-transparent rounded-full mr-2"></span> Memproses...';
            btnLogin.disabled = true;
            btnLogin.classList.add('opacity-75', 'cursor-not-allowed');

            try {
                // Proses Login Firebase
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                
                // Cek apakah admin atau relawan biasa berdasarkan email (sederhana)
                if(email.includes('admin')) {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'index.html';
                }

            } catch (error) {
                console.error("Login Error:", error);
                errorAlert.classList.remove('hidden');
                
                // Custom error messages
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    errorMessage.innerText = "Email atau password yang Anda masukkan salah.";
                } else if (error.code === 'auth/network-request-failed') {
                     errorMessage.innerText = "Koneksi internet bermasalah. Tidak bisa login offline.";
                } else {
                    errorMessage.innerText = "Terjadi kesalahan: " + error.message;
                }
            } finally {
                btnLogin.innerHTML = 'Masuk ke Sistem <i data-lucide="arrow-right" class="w-5 h-5 ml-2"></i>';
                btnLogin.disabled = false;
                btnLogin.classList.remove('opacity-75', 'cursor-not-allowed');
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
