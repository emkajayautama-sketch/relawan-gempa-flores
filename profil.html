<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profil - Relawan Gempa</title>
    <link href="/src/style.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-900 via-slate-900 to-black antialiased overflow-x-hidden selection:bg-trust-500 selection:text-white pb-24 min-h-screen">
    
    <!-- Background Patterns -->
    <div class="fixed top-0 left-0 w-full h-[40vh] -z-10 bg-gradient-to-b from-trust-900/50 to-slate-900 rounded-b-[3rem] overflow-hidden">
        <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(#ffffff 1px, transparent 1px); background-size: 24px 24px;"></div>
    </div>

    <!-- Header -->
    <header class="w-full max-w-md mx-auto pt-safe px-6 pb-4">
        <div class="flex items-center justify-between mt-4">
            <button onclick="window.location.href='index.html'" class="w-10 h-10 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center text-white border border-white/30 hover:bg-white/30 transition-all active:scale-95">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>
            <h1 class="text-white text-lg font-bold">Profil Akun</h1>
            <div class="w-10 h-10"></div> <!-- Placeholder for balance -->
        </div>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-md mx-auto px-6 mt-6 z-10 relative">
        
        <!-- User Info Card -->
        <div class="glass-dark bg-white/10 backdrop-blur-xl p-6 rounded-3xl border border-white/20 shadow-xl mb-6 flex flex-col items-center shadow-black/30">
            <div class="w-20 h-20 bg-trust-500/20 rounded-full flex items-center justify-center mb-4 border border-trust-500/30 shadow-[0_0_15px_rgba(56,189,248,0.3)]">
                <i data-lucide="user" class="w-10 h-10 text-trust-400"></i>
            </div>
            <h2 id="user-email" class="text-xl font-bold text-white mb-1">Memuat...</h2>
            <p class="text-trust-200 text-sm font-medium px-3 py-1 bg-trust-800/50 rounded-full border border-trust-500/30">Relawan Lapangan</p>
        </div>

        <!-- Posko Info -->
        <h3 class="text-white font-bold text-lg mb-3 ml-2">Pengaturan Posko</h3>
        <div class="bg-white/5 backdrop-blur-md rounded-3xl p-5 shadow-lg border border-white/10 mb-6 flex items-center justify-between cursor-pointer hover:bg-white/10 active:scale-95 transition-all shadow-black/20" id="btn-ubah-posko">
            <div class="flex items-center">
                <div class="w-12 h-12 bg-trust-500/20 rounded-2xl flex items-center justify-center mr-4 border border-trust-500/30">
                    <i data-lucide="tent" class="w-6 h-6 text-trust-400"></i>
                </div>
                <div>
                    <p class="text-xs text-slate-400 font-medium mb-0.5">Posko Aktif Saat Ini</p>
                    <h4 id="posko-name" class="text-white font-bold">Posko Nagekeo</h4>
                </div>
            </div>
            <i data-lucide="edit-3" class="w-5 h-5 text-trust-400"></i>
        </div>

        <!-- App Info -->
        <div class="bg-white/5 backdrop-blur-md rounded-3xl p-5 shadow-lg border border-white/10 mb-8 flex flex-col items-center text-center shadow-black/20">
            <div class="w-12 h-12 bg-slate-800 rounded-2xl flex items-center justify-center mb-3 border border-white/10">
                <i data-lucide="info" class="w-6 h-6 text-slate-400"></i>
            </div>
            <h4 class="text-white font-bold mb-1">Relawan Gempa v1.0</h4>
            <p class="text-xs text-slate-400">Aplikasi Sistem Pendataan Darurat Bencana</p>
        </div>

        <!-- Logout Button -->
        <button id="btnLogout" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 rounded-2xl py-4 font-bold flex justify-center items-center transition-all active:scale-95 shadow-sm">
            <i data-lucide="log-out" class="w-5 h-5 mr-2"></i> Keluar dari Akun (Logout)
        </button>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 w-full bg-slate-900/80 backdrop-blur-2xl border-t border-white/10 pb-safe pt-2 px-6 z-50">
        <div class="max-w-md mx-auto flex justify-around items-center h-16">
            <a href="index.html" class="flex flex-col items-center justify-center w-full text-slate-500 hover:text-white transition-colors">
                <div class="p-1.5">
                    <i data-lucide="home" class="w-5 h-5"></i>
                </div>
                <span class="text-[10px] font-medium mt-1">Beranda</span>
            </a>
            <a href="riwayat.html" class="flex flex-col items-center justify-center w-full text-slate-500 hover:text-white transition-colors">
                <div class="p-1.5">
                    <i data-lucide="history" class="w-5 h-5"></i>
                </div>
                <span class="text-[10px] font-medium mt-1">Riwayat</span>
            </a>
            <a href="profil.html" class="flex flex-col items-center justify-center w-full text-trust-400 group cursor-default">
                <div class="p-1.5 bg-trust-500/20 border border-trust-500/30 rounded-xl transition-colors shadow-[0_0_15px_rgba(56,189,248,0.2)]">
                    <i data-lucide="user" class="w-5 h-5"></i>
                </div>
                <span class="text-[10px] font-semibold mt-1">Profil</span>
            </a>
        </div>
    </nav>

    <style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .pt-safe { padding-top: env(safe-area-inset-top); }
    </style>

    <script type="module">
        import { auth } from './src/firebase.js';
        import { onAuthStateChanged, signOut } from 'firebase/auth';

        lucide.createIcons();

        // Elemen
        const userEmailEl = document.getElementById('user-email');
        const poskoNameEl = document.getElementById('posko-name');
        
        // Load Posko
        const savedPosko = localStorage.getItem('poskoName') || 'Posko Nagekeo';
        poskoNameEl.innerText = savedPosko;

        // Auth Guard & Info
        onAuthStateChanged(auth, (user) => {
            if (user) {
                userEmailEl.innerText = user.email;
            } else {
                window.location.href = 'login.html';
            }
        });

        // Edit Posko
        document.getElementById('btn-ubah-posko').addEventListener('click', () => {
            const newName = prompt("Ubah Nama Posko Aktif Anda:", poskoNameEl.innerText);
            if(newName) {
                localStorage.setItem('poskoName', newName);
                poskoNameEl.innerText = newName;
            }
        });

        // Logout
        document.getElementById('btnLogout').addEventListener('click', () => {
            if (confirm("Apakah Anda yakin ingin Keluar (Logout)?")) {
                const btn = document.getElementById('btnLogout');
                btn.innerHTML = '<span class="animate-spin w-5 h-5 border-2 border-red-600 border-t-transparent rounded-full mr-2"></span> Memproses...';
                
                signOut(auth).then(() => {
                    window.location.href = 'login.html';
                }).catch((error) => {
                    console.error("Gagal Logout:", error);
                    alert("Gagal Keluar: " + error.message);
                });
            }
        });
    </script>
</body>
</html>
