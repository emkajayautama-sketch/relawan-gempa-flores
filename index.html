<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Relawan - Pendataan Darurat</title>
    <link href="/src/style.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Auth Guard -->
    <script type="module">
        import { auth } from './src/firebase.js';
        import { onAuthStateChanged, signOut } from 'firebase/auth';

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                // User is signed out, redirect to login
                window.location.href = 'login.html';
            }
        });

        // Global logout function
        window.logout = () => {
            signOut(auth).then(() => window.location.href = 'login.html');
        };
    </script>
</head>
<body class="bg-slate-200 antialiased overflow-x-hidden selection:bg-trust-500 selection:text-white">
    <!-- Mobile Container Wrapper -->
    <div class="max-w-md mx-auto min-h-screen relative bg-slate-50 shadow-2xl pb-24 overflow-hidden">
    <!-- Gradient Background Element -->
    <div class="fixed top-0 left-0 w-full h-80 bg-gradient-to-br from-trust-600 to-trust-900 rounded-b-[40px] -z-10 shadow-2xl"></div>

    <!-- Header / Navbar -->
    <header class="absolute top-0 w-full max-w-md glass z-50 transition-all duration-300">
        <div class="px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white/20 p-2 rounded-xl backdrop-blur-md border border-white/30">
                    <i data-lucide="shield-alert" class="text-white w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-white font-bold text-lg leading-tight tracking-wide">RELAWAN GEMPA</h1>
                    <p class="text-trust-100 text-xs font-medium flex items-center mt-0.5">
                        <span class="w-2 h-2 rounded-full bg-green-400 mr-1.5 animate-pulse"></span> Tersinkronisasi
                    </p>
                </div>
            </div>
            
            <button class="w-10 h-10 rounded-full border-2 border-white/40 overflow-hidden shadow-sm hover:scale-105 transition-transform">
                <img src="https://i.pravatar.cc/150?img=32" alt="Profile" class="w-full h-full object-cover">
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="pt-28 px-6">
        <!-- Greeting Section -->
        <div class="mb-8 animate-fade-in-up">
            <h2 class="text-3xl font-extrabold text-white mb-1">Halo, Budi!</h2>
            <p class="text-trust-100 text-sm">Tetap aman dan semangat bertugas di lapangan.</p>
        </div>

        <!-- Quick Stats Card -->
        <div class="bg-white rounded-3xl p-5 shadow-xl shadow-trust-900/10 mb-8 border border-slate-100 relative overflow-hidden transform hover:-translate-y-1 transition-all duration-300">
            <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-bl from-trust-100 to-transparent rounded-bl-full opacity-50"></div>
            <div class="flex items-center justify-between relative z-10">
                <div>
                    <p class="text-slate-500 text-xs font-semibold uppercase tracking-wider mb-1">Posko Aktif Anda</p>
                    <h3 class="text-2xl font-bold text-slate-800">Desa Wulanggitang</h3>
                    <p class="text-slate-500 text-sm mt-1 flex items-center">
                        <i data-lucide="map-pin" class="w-3 h-3 mr-1 text-trust-500"></i> Kab. Flores Timur
                    </p>
                </div>
                <div class="bg-trust-50 p-3 rounded-2xl">
                    <i data-lucide="tent" class="w-8 h-8 text-trust-600"></i>
                </div>
            </div>
        </div>

        <!-- Action Grid -->
        <h3 class="text-lg font-bold text-slate-800 mb-4 px-1">Menu Utama</h3>
        <div class="grid gap-4">
            
            <!-- Action 1: Pendataan Pengungsi -->
            <a href="form-pengungsi.html" class="w-full bg-white rounded-3xl p-5 shadow-lg shadow-slate-200/50 border border-slate-100 flex items-center group hover:bg-trust-50 hover:border-trust-200 transition-all duration-300 transform active:scale-95">
                <div class="bg-gradient-to-br from-trust-400 to-trust-600 p-4 rounded-2xl shadow-inner shadow-white/20">
                    <i data-lucide="users" class="w-7 h-7 text-white"></i>
                </div>
                <div class="ml-4 text-left flex-1">
                    <h4 class="text-lg font-bold text-slate-800 group-hover:text-trust-700 transition-colors">Data Pengungsi</h4>
                    <p class="text-xs text-slate-500 mt-0.5">Input data Kepala Keluarga & Anggota</p>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-slate-300 group-hover:text-trust-500 transition-colors"></i>
            </a>

            <!-- Action 2: Lapor Logistik -->
            <a href="form-logistik.html" class="w-full bg-white rounded-3xl p-5 shadow-lg shadow-slate-200/50 border border-slate-100 flex items-center group hover:bg-orange-50 hover:border-orange-200 transition-all duration-300 transform active:scale-95">
                <div class="bg-gradient-to-br from-alert-500 to-alert-600 p-4 rounded-2xl shadow-inner shadow-white/20">
                    <i data-lucide="package-open" class="w-7 h-7 text-white"></i>
                </div>
                <div class="ml-4 text-left flex-1">
                    <h4 class="text-lg font-bold text-slate-800 group-hover:text-alert-600 transition-colors">Lapor Logistik</h4>
                    <p class="text-xs text-slate-500 mt-0.5">Update kebutuhan pangan, hunian, medis</p>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-slate-300 group-hover:text-alert-500 transition-colors"></i>
            </a>

            <!-- Action 3: Dokumentasi -->
            <button class="w-full bg-white rounded-3xl p-5 shadow-lg shadow-slate-200/50 border border-slate-100 flex items-center group hover:bg-slate-100 hover:border-slate-300 transition-all duration-300 transform active:scale-95">
                <div class="bg-gradient-to-br from-slate-600 to-slate-800 p-4 rounded-2xl shadow-inner shadow-white/20">
                    <i data-lucide="camera" class="w-7 h-7 text-white"></i>
                </div>
                <div class="ml-4 text-left flex-1">
                    <h4 class="text-lg font-bold text-slate-800 transition-colors">Foto Lapangan</h4>
                    <p class="text-xs text-slate-500 mt-0.5">Unggah bukti visual kondisi posko</p>
                </div>
                <i data-lucide="chevron-right" class="w-5 h-5 text-slate-300 transition-colors"></i>
            </button>

        </div>
    </main>

    <!-- Bottom Navigation Bar (Optional for PWA feel) -->
    <nav class="absolute bottom-0 w-full max-w-md glass border-t border-slate-200 pb-safe pt-2 px-6">
        <div class="flex justify-around items-center h-16">
            <button class="flex flex-col items-center justify-center w-full text-trust-600 group">
                <div class="p-1.5 bg-trust-100 rounded-xl group-hover:bg-trust-200 transition-colors">
                    <i data-lucide="home" class="w-5 h-5"></i>
                </div>
                <span class="text-[10px] font-semibold mt-1">Beranda</span>
            </button>
            <button class="flex flex-col items-center justify-center w-full text-slate-400 hover:text-slate-600 transition-colors">
                <div class="p-1.5">
                    <i data-lucide="history" class="w-5 h-5"></i>
                </div>
                <span class="text-[10px] font-medium mt-1">Riwayat</span>
            </button>
            <button class="flex flex-col items-center justify-center w-full text-slate-400 hover:text-slate-600 transition-colors">
                <div class="p-1.5">
                    <i data-lucide="user" class="w-5 h-5"></i>
                </div>
                <span class="text-[10px] font-medium mt-1">Profil</span>
            </button>
        </div>
    </nav>

    <style>
        /* Smooth fade-in-up animation */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        /* Handle iOS safe area padding for bottom nav */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>

    <!-- Initialize Icons -->
    <script>
        lucide.createIcons();
        
        // Header scroll effect
        const header = document.querySelector('header');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 10) {
                header.classList.add('shadow-md', 'bg-trust-700/90');
                header.classList.remove('glass');
            } else {
                header.classList.remove('shadow-md', 'bg-trust-700/90');
                header.classList.add('glass');
            }
        });
    </script>
    </div>
</body>
</html>
